[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

# Checks: no debuginfo and unoptimized deps, so a cold build is much faster
# (`scripts/check.sh` with CARGO_PROFILE_ARG="--profile ci").
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0

# Release: no symbols, so the packaged binary is much smaller.
[profile.release]
strip = true
