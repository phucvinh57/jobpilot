[package]
name = "jobpilot"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Tailored CVs, managed-browser job applications and Gmail status tracking"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jobpilot-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"

[dev-dependencies]
tempfile = "3"

[features]
# The bundled web app (`dist`) instead of the dev server. On by default, so `cargo run -p jobpilot`
# shows the built UI; `bun run tauri dev` turns it off (`--no-default-features`) and loads Vite on :1420.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# UI checks without a person at the screen: the webview snapshots itself and runs a script
# (`src/devtools.rs`). Never part of a release package.
dev-tools = ["dep:webkit2gtk", "dep:gtk", "dep:cairo-rs"]

# The versions Tauri itself links (same `PlatformWebview::inner()` type).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", optional = true }
gtk = { version = "0.18", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }
