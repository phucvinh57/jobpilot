[package]
name = "jobpilot-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "JobPilot's engine: everything except the UI (no Tauri, no webview)"

[lib]
name = "jobpilot_engine"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_yaml = "0.9"
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
jsonschema = { version = "0.61", default-features = false }
dirs = "7"
regex = "1"
chrono.workspace = true
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
rand = "0.10"
dom_smoothie = "0.19"
html2text = "0.13"
pdf-extract = "0.12"
futures = "0.3"
adk-graph = "=2.3.0"
async-trait = "0.1"
tokio-util = "0.7"
# The browser bridge: the JobPilot extension connects to a WebSocket server on 127.0.0.1 (no TLS).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
url.workspace = true
quick-xml = "0.42"
encoding_rs = "0.8"
notify-rust = "4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry", "tracing-log"] }
tracing-appender = "0.2.5"
# Only with the `test-browser` feature (the browser test kit's temp dirs).
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# Test helpers for the desktop shell's unit tests (`profile::TEST_PROFILE`, `profile::set_test_profile`);
# the shell turns it on in its dev-dependencies only, so it is never part of a release package.
test-util = []
# The browser test kit (`browser::bridge::testkit`: Chromium with the built extension) for the
# integration tests under `tests/`; never part of a release package:
# `cargo test -p jobpilot-engine --features test-browser --test e2e_discovery -- --ignored`.
test-browser = ["dep:tempfile"]

# The OS keyring: keyring v3 silently falls back to an in-memory mock on a platform without its
# backend feature, so every supported OS names its own store here (on any other OS there is no
# keyring crate, so the build fails instead).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
