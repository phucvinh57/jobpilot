[package]
name = "jobpilot-core"
edition.workspace = true
version.workspace = true

[lib]
name = "jobpilot_core"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
jsonschema = { version = "0.26", default-features = false }
dirs = "6"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dom_smoothie = "0.19"
html2text = "0.13"
pdf-extract = "0.12"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime", "bytes"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
futures = "0.3"
adk-graph = "=2.3.0"
async-trait = "0.1"
tokio-util = "0.7"
url = "2"
quick-xml = "0.41"
notify-rust = "4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry", "tracing-log"] }
tracing-appender = "0.2.5"

[dev-dependencies]
tempfile = "3"
