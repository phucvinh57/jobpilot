name: Risk

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - auto_merge_enabled
      - auto_merge_disabled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    name: Risk label
    runs-on: ubuntu-latest
    steps:
      - name: Check the risk label and auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
          HIGH_PATHS: >-
            ^(profile\.yaml$|assets/cv\.typ$|assets/prompts/|scripts/|lefthook\.yml$|\.github/|\.claude/|\.agents/|AGENTS\.md$|CLAUDE\.md$|docs/REVIEW\.md$)
        run: |
          risk=$(jq -r '[.[] | select(startswith("risk: "))] | if length == 1 then .[0] | ltrimstr("risk: ") else "" end' <<<"$LABELS")
          if [[ ! $risk =~ ^(low|medium|high)$ ]]; then
            echo "::error::Add exactly one label: risk: low, risk: medium or risk: high."
            exit 1
          fi

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          high=$(grep -E "$HIGH_PATHS" <<<"$files" || true)
          if [[ -n $high && $risk != high ]]; then
            echo "::error::These paths are High risk (docs/REVIEW.md), so label the PR risk: high:"
            echo "$high"
            exit 1
          fi

          if [[ $AUTO_MERGE == true && $risk == high ]]; then
            echo "::error::High-risk PRs need a human merge. Disable auto-merge."
            exit 1
          fi

          if [[ $AUTO_MERGE == true && $BASE != main ]]; then
            echo "::error::Auto-merge is only for PRs into main. Disable it until the stack below merges."
            exit 1
          fi

          echo "risk: $risk, auto-merge: $AUTO_MERGE"
