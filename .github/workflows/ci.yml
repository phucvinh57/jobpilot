name: CI

# `changes` decides which check groups the diff touches (`scripts/check.sh --plan`: one set of path
# rules for CI and the pre-push hook); each group then runs in its own job, in parallel, with only
# the tools it needs. A web-only change never installs Rust or the GTK/WebKit libraries.
on:
  pull_request:
    # Docs-only changes need no checks (they go straight to main, see AGENTS.md "Workflow").
    paths-ignore:
      - "docs/**"
  # Main runs the groups its push touched and saves the caches PRs restore (a PR's cache is not
  # visible to other PRs).
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_ARG: --profile ci

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.plan.outputs.web }}
      rust: ${{ steps.plan.outputs.rust }}
      render: ${{ steps.plan.outputs.render }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the paths changed since the merge base with the base branch.
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            plan=$(scripts/check.sh --plan "origin/$BASE_REF")
          elif [[ $EVENT == push && -n $BEFORE && ! $BEFORE =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            plan=$(scripts/check.sh --plan "$BEFORE")
          else
            plan=$(scripts/check.sh --plan --all)
          fi
          echo "$plan"
          echo "$plan" >>"$GITHUB_OUTPUT"

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # bun from the `packageManager` field; vite and vitest run on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check
        run: scripts/check.sh --all --only web

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The e2e test renders a real CV.
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: rui314/setup-mold@v1 # faster linking of the desktop binary

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # One cache, written by main only; PRs restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # No web build here: check.sh gives the crate a placeholder `dist/`.
      - name: Check
        env:
          JOBPILOT_SECRETS: memory
        run: scripts/check.sh --all --only rust

  render:
    name: Render
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - name: Check
        run: scripts/check.sh --all --only render

  ci-ok:
    name: CI OK
    needs: [changes, web, rust, render]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A skipped group (its paths did not change) is fine.
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
